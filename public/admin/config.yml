# ═══════════════════════════════════════════════════════════════════
#  DECAP CMS — Konfigurasi Desa Wisata Nglumut (SECURE)
#  Security additions:
#  - URL validation patterns
#  - Phone number format validation
#  - Input length limits
# ═══════════════════════════════════════════════════════════════════

backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: id

collections:

  # ────────────────────────────────────────────────────────────────
  #  1. GALERI UTAMA
  # ────────────────────────────────────────────────────────────────
  - name: "galeri"
    label: "🖼️  Galeri Foto"
    label_singular: "Foto Galeri"
    description: >
      Foto-foto yang tampil di section galeri geser (slideshow) pada
      halaman utama. Tersedia 6 slot — ubah foto dan caption sesuai kebutuhan.
    folder: "_data/galeri"
    create: false
    slug: "{{fields.urutan}}"
    summary: "Slot {{urutan}} — {{judul}}"
    sortable_fields: ["urutan"]
    fields:
      - label: "Nomor Urutan"
        name: "urutan"
        widget: "number"
        value_type: "int"
        min: 1
        max: 6
        hint: "Urutan tampil di galeri (1 = pertama, 6 = terakhir)"

      - label: "Foto"
        name: "foto"
        widget: "image"
        hint: >
          Upload foto baru untuk slot ini.
          Ukuran ideal: lebar minimal 1200px, format JPG atau PNG.
          Foto lama akan diganti otomatis.
        media_library:
          config:
            multiple: false

      - label: "Judul Foto"
        name: "judul"
        widget: "string"
        hint: "Contoh: View Sabo Dam, Wahana Tubing, Pendopo Wisata"

      - label: "Keterangan Singkat"
        name: "keterangan"
        widget: "string"
        required: false
        hint: "Contoh: Bendungan Pengendali Vulkanik (opsional, bisa dikosongkan)"

      - label: "Tampilkan di Galeri?"
        name: "aktif"
        widget: "boolean"
        default: true
        hint: "Nonaktifkan jika foto belum siap ditampilkan"


  # ────────────────────────────────────────────────────────────────
  #  2. FOTO HERO
  # ────────────────────────────────────────────────────────────────
  - name: "hero"
    label: "🏔️  Foto Hero (Banner Utama)"
    label_singular: "Foto Hero"
    description: >
      Tiga foto latar besar yang tampil bergiliran di bagian paling atas
      halaman (banner utama / hero section).
    folder: "_data/hero"
    create: false
    slug: "{{fields.urutan}}"
    summary: "Slide {{urutan}} — {{judul}}"
    sortable_fields: ["urutan"]
    fields:
      - label: "Nomor Slide"
        name: "urutan"
        widget: "number"
        value_type: "int"
        min: 1
        max: 3

      - label: "Foto Latar"
        name: "foto"
        widget: "image"
        hint: >
          Foto latar hero. Gunakan foto landscape (horizontal) beresolusi tinggi —
          minimal 1920×1080px agar tidak terlihat pecah di layar lebar.

      - label: "Keterangan (alt text)"
        name: "judul"
        widget: "string"
        hint: "Deskripsi singkat foto — dipakai sebagai alt text untuk aksesibilitas"


  # ────────────────────────────────────────────────────────────────
  #  3. FOTO FASILITAS
  # ────────────────────────────────────────────────────────────────
  - name: "fasilitas"
    label: "🎯  Foto Fasilitas & Wahana"
    label_singular: "Fasilitas"
    description: >
      Lima kartu fasilitas yang tampil di section Wahana & Fasilitas.
      Setiap fasilitas memiliki 3 foto slideshow yang berganti otomatis.
      Kamu bisa mengganti nama, deskripsi, dan ketiga fotonya.
    folder: "_data/fasilitas"
    create: false
    slug: "{{fields.id}}"
    summary: "{{nomor}}. {{nama}}"
    sortable_fields: ["nomor"]
    fields:
      - label: "Nomor Urutan Kartu"
        name: "nomor"
        widget: "number"
        value_type: "int"
        min: 1
        max: 5
        hint: "Urutan kartu dari kiri ke kanan (desktop) atau atas ke bawah (mobile)"

      - label: "ID Internal"
        name: "id"
        widget: "string"
        hint: "Jangan diubah — ID unik untuk sistem (contoh: sabo-dam, tubing)"

      - label: "Nama Fasilitas"
        name: "nama"
        widget: "string"
        hint: "Contoh: View Sabo Dam, Sewa Tubing, Sewa Pendopo"

      - label: "Kategori (Badge)"
        name: "tag"
        widget: "string"
        hint: "Kategori yang tampil sebagai badge kecil di kartu"

      - label: "Deskripsi Lengkap"
        name: "deskripsi"
        widget: "text"
        hint: >
          Penjelasan singkat fasilitas ini (2-3 kalimat).
          Teks ini tampil di bawah nama saat kartu di-expand/hover.

      - label: "Foto 1"
        name: "foto_1"
        widget: "image"
        required: false
        hint: "Foto pertama dalam slideshow kartu ini (opsional)"

      - label: "Foto 2"
        name: "foto_2"
        widget: "image"
        required: false
        hint: "Foto kedua dalam slideshow kartu ini (opsional)"

      - label: "Foto 3"
        name: "foto_3"
        widget: "image"
        required: false
        hint: "Foto ketiga dalam slideshow kartu ini (opsional)"

      - label: "Aktifkan Poster?"
        name: "poster_enabled"
        widget: "boolean"
        default: false
        hint: "Jika aktif, tombol lihat poster akan muncul"

      - label: "Poster 1 Foto"
        name: "poster_1_foto"
        widget: "image"
        required: false

      - label: "Poster 1 Judul"
        name: "poster_1_judul"
        widget: "string"
        required: false

      - label: "Poster 2 Foto"
        name: "poster_2_foto"
        widget: "image"
        required: false

      - label: "Poster 2 Judul"
        name: "poster_2_judul"
        widget: "string"
        required: false

      - label: "Poster 3 Foto"
        name: "poster_3_foto"
        widget: "image"
        required: false

      - label: "Poster 3 Judul"
        name: "poster_3_judul"
        widget: "string"
        required: false


  # ────────────────────────────────────────────────────────────────
  #  4. FOTO SEJARAH
  # ────────────────────────────────────────────────────────────────
  - name: "sejarah_foto"
    label: "📜  Foto Sejarah Desa"
    label_singular: "Foto Sejarah"
    description: >
      Tiga foto yang tampil di dalam pop-up "Baca Selengkapnya" pada
      section Sejarah. Setiap foto mewakili satu sub-bagian cerita.
    folder: "_data/sejarah"
    create: false
    slug: "{{fields.id}}"
    summary: "{{judul_bagian}}"
    fields:
      - label: "ID Internal"
        name: "id"
        widget: "string"
        hint: "Jangan diubah"

      - label: "Judul Bagian"
        name: "judul_bagian"
        widget: "string"
        hint: >
          Label bagian sejarah yang difoto ini.
          Contoh: Gunung Merapi, Lahan Pertanian, Taman Sabo Dam

      - label: "Foto"
        name: "foto"
        widget: "image"
        hint: >
          Foto ilustrasi untuk bagian cerita ini.
          Ukuran ideal: rasio 16:9, lebar minimal 800px.

      - label: "Keterangan Foto"
        name: "keterangan"
        widget: "string"
        required: false
        hint: "Caption singkat di bawah foto (opsional)"


  # ────────────────────────────────────────────────────────────────
  #  5. PENGATURAN UMUM (WITH VALIDATION)
  # ────────────────────────────────────────────────────────────────
  - name: "pengaturan"
    label: "⚙️  Pengaturan Umum"
    description: >
      Informasi dasar desa wisata: nomor WhatsApp, jam buka, dan
      tautan media sosial. Ubah di sini jika ada perubahan kontak.
    files:
      - label: "Info Kontak & Jam Buka"
        name: "kontak"
        file: "_data/pengaturan/kontak.json"
        fields:
          # ── WhatsApp (with validation) ────────────────────────
          - label: "Nomor WhatsApp"
            name: "whatsapp"
            widget: "string"
            pattern: ['^\d{10,15}$', 'Hanya angka, 10-15 karakter (contoh: 6285371234567)']
            hint: >
              Format internasional tanpa tanda + atau spasi.
              Contoh: 6285371234567
              (62 = kode negara Indonesia, lanjut nomor tanpa 0 di depan)

          # ── Operating Hours ──────────────────────────────────
          - label: "Jam Buka"
            name: "jam_buka"
            widget: "string"
            default: "07.00 – 17.00 WIB"
            hint: "Contoh: 07.00 – 17.00 WIB"

          - label: "Hari Operasional"
            name: "hari_operasional"
            widget: "string"
            default: "Senin – Minggu"
            hint: "Contoh: Senin – Minggu, atau Selasa – Minggu (tutup Senin)"

          # ── Address ──────────────────────────────────────────
          - label: "Alamat Lengkap"
            name: "alamat"
            widget: "text"
            hint: "Alamat yang tampil di section Reservasi dan footer"

          # ── Instagram URL (with validation) ──────────────────
          - label: "Link Instagram"
            name: "instagram"
            widget: "string"
            required: false
            pattern: ['^https?:\/\/(www\.)?instagram\.com\/', 'Harus URL Instagram valid (contoh: https://instagram.com/desa_wisata_nglumut)']
            hint: "URL lengkap, contoh: https://instagram.com/desa_wisata_nglumut"

          # ── TikTok URL (with validation) ─────────────────────
          - label: "Link TikTok"
            name: "tiktok"
            widget: "string"
            required: false
            pattern: ['^https?:\/\/(www\.)?tiktok\.com\/', 'Harus URL TikTok valid (contoh: https://tiktok.com/@desa_wisata_nglumut)']
            hint: "URL lengkap, contoh: https://tiktok.com/@desa_wisata_nglumut"
