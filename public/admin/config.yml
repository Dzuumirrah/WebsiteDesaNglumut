# ═══════════════════════════════════════════════════════════════════
#  DECAP CMS — Konfigurasi Desa Wisata Nglumut
#  File ini JANGAN diubah kecuali kamu tahu apa yang dilakukan.
#  Letakkan di: public/admin/config.yml
# ═══════════════════════════════════════════════════════════════════

# ── Backend: Netlify Git Gateway ────────────────────────────────────
# Menghubungkan CMS ke repository GitHub kamu melalui Netlify.
# Stakeholder tidak perlu punya akun GitHub — cukup Netlify Identity.
backend:
  name: git-gateway
  branch: main          # ganti ke "master" jika nama branch utama kamu master


# ── Folder penyimpanan media (foto) ────────────────────────────────
# Semua foto yang diupload stakeholder akan masuk ke folder ini.
media_folder: "assets/uploads"          # path di dalam repo
public_folder: "/assets/uploads"        # URL publik saat diakses browser


# ── Locale ─────────────────────────────────────────────────────────
locale: id


# ══════════════════════════════════════════════════════════════════
#  KOLEKSI KONTEN
#  Setiap "collections" = satu menu di sidebar admin.
# ══════════════════════════════════════════════════════════════════
collections:

  # ────────────────────────────────────────────────────────────────
  #  1. GALERI UTAMA (section #highlights)
  #     6 slot foto yang tampil di slideshow galeri homepage.
  #     Stakeholder bisa ganti foto & caption tiap slot.
  # ────────────────────────────────────────────────────────────────
  - name: "galeri"
    label: "🖼️  Galeri Foto"
    label_singular: "Foto Galeri"
    description: >
      Foto-foto yang tampil di section galeri geser (slideshow) pada
      halaman utama. Tersedia 6 slot — ubah foto dan caption sesuai kebutuhan.
    folder: "_data/galeri"
    create: false           # stakeholder tidak bisa tambah slot baru (tetap 6)
    slug: "{{fields.urutan}}"
    summary: "Slot {{urutan}} — {{judul}}"
    sortable_fields: ["urutan"]
    fields:
      - label: "Nomor Urutan"
        name: "urutan"
        widget: "number"
        value_type: "int"
        min: 1
        max: 6
        hint: "Urutan tampil di galeri (1 = pertama, 6 = terakhir)"

      - label: "Foto"
        name: "foto"
        widget: "image"
        hint: >
          Upload foto baru untuk slot ini.
          Ukuran ideal: lebar minimal 1200px, format JPG atau PNG.
          Foto lama akan diganti otomatis.
        media_library:
          config:
            multiple: false

      - label: "Judul Foto"
        name: "judul"
        widget: "string"
        hint: "Contoh: View Sabo Dam, Wahana Tubing, Pendopo Wisata"

      - label: "Keterangan Singkat"
        name: "keterangan"
        widget: "string"
        required: false
        hint: "Contoh: Bendungan Pengendali Vulkanik (opsional, bisa dikosongkan)"

      - label: "Tampilkan di Galeri?"
        name: "aktif"
        widget: "boolean"
        default: true
        hint: "Nonaktifkan jika foto belum siap ditampilkan"


  # ────────────────────────────────────────────────────────────────
  #  2. FOTO HERO / SLIDESHOW UTAMA (section #home)
  #     3 foto latar di bagian paling atas halaman (slideshow hero).
  # ────────────────────────────────────────────────────────────────
  - name: "hero"
    label: "🏔️  Foto Hero (Banner Utama)"
    label_singular: "Foto Hero"
    description: >
      Tiga foto latar besar yang tampil bergiliran di bagian paling atas
      halaman (banner utama / hero section).
    folder: "_data/hero"
    create: false           # tetap 3 slide
    slug: "{{fields.urutan}}"
    summary: "Slide {{urutan}} — {{judul}}"
    sortable_fields: ["urutan"]
    fields:
      - label: "Nomor Slide"
        name: "urutan"
        widget: "number"
        value_type: "int"
        min: 1
        max: 3

      - label: "Foto Latar"
        name: "foto"
        widget: "image"
        hint: >
          Foto latar hero. Gunakan foto landscape (horizontal) beresolusi tinggi —
          minimal 1920×1080px agar tidak terlihat pecah di layar lebar.

      - label: "Keterangan (alt text)"
        name: "judul"
        widget: "string"
        hint: "Deskripsi singkat foto — dipakai sebagai alt text untuk aksesibilitas"


  # ────────────────────────────────────────────────────────────────
  #  3. FOTO FASILITAS / WAHANA (section #facilities)
  #     5 kartu fasilitas, masing-masing punya 3 foto slideshow.
  #     Stakeholder bisa ganti foto tiap fasilitas.
  # ────────────────────────────────────────────────────────────────
  - name: "fasilitas"
    label: "🎯  Foto Fasilitas & Wahana"
    label_singular: "Fasilitas"
    description: >
      Lima kartu fasilitas yang tampil di section Wahana & Fasilitas.
      Setiap fasilitas memiliki 3 foto slideshow yang berganti otomatis.
      Kamu bisa mengganti nama, deskripsi, dan ketiga fotonya.
    folder: "_data/fasilitas"
    create: false           # 5 fasilitas tetap
    slug: "{{fields.id}}"
    summary: "{{nomor}}. {{nama}}"
    sortable_fields: ["nomor"]
    fields:
      - label: "Nomor Urutan Kartu"
        name: "nomor"
        widget: "number"
        value_type: "int"
        min: 1
        max: 5
        hint: "Urutan kartu dari kiri ke kanan (desktop) atau atas ke bawah (mobile)"

      - label: "ID Internal"
        name: "id"
        widget: "string"
        hint: "Jangan diubah — ID unik untuk sistem (contoh: sabo-dam, tubing)"

      - label: "Nama Fasilitas"
        name: "nama"
        widget: "string"
        hint: "Contoh: View Sabo Dam, Sewa Tubing, Sewa Pendopo"

      - label: "Label / Tag"
        name: "tag"
        widget: "select"
        options:
          - { label: "Ikonik", value: "Ikonik" }
          - { label: "Sewa", value: "Sewa" }
          - { label: "Edukasi", value: "Edukasi" }
          - { label: "Budaya", value: "Budaya" }
          - { label: "Baru", value: "Baru" }
        hint: "Kategori yang tampil sebagai badge kecil di kartu"

      - label: "Deskripsi Singkat"
        name: "deskripsi"
        widget: "text"
        hint: >
          Kalimat pendek yang muncul saat kartu di-hover (desktop) atau
          diketuk (mobile). Maksimal 2 kalimat.

      - label: "Foto 1 (Utama)"
        name: "foto_1"
        widget: "image"
        hint: >
          Foto pertama yang tampil saat kartu pertama kali dibuka.
          Sebaiknya foto terbaik / paling representatif.

      - label: "Foto 2"
        name: "foto_2"
        widget: "image"
        required: false
        hint: "Foto kedua dalam slideshow kartu ini (opsional)"

      - label: "Foto 3"
        name: "foto_3"
        widget: "image"
        required: false
        hint: "Foto ketiga dalam slideshow kartu ini (opsional)"


  # ────────────────────────────────────────────────────────────────
  #  4. FOTO SEJARAH (Modal Baca Selengkapnya)
  #     3 foto yang tampil di dalam modal pop-up sejarah desa.
  # ────────────────────────────────────────────────────────────────
  - name: "sejarah_foto"
    label: "📜  Foto Sejarah Desa"
    label_singular: "Foto Sejarah"
    description: >
      Tiga foto yang tampil di dalam pop-up "Baca Selengkapnya" pada
      section Sejarah. Setiap foto mewakili satu sub-bagian cerita.
    folder: "_data/sejarah"
    create: false
    slug: "{{fields.id}}"
    summary: "{{judul_bagian}}"
    fields:
      - label: "ID Internal"
        name: "id"
        widget: "string"
        hint: "Jangan diubah"

      - label: "Judul Bagian"
        name: "judul_bagian"
        widget: "string"
        hint: >
          Label bagian sejarah yang difoto ini.
          Contoh: Gunung Merapi, Lahan Pertanian, Taman Sabo Dam

      - label: "Foto"
        name: "foto"
        widget: "image"
        hint: >
          Foto ilustrasi untuk bagian cerita ini.
          Ukuran ideal: rasio 16:9, lebar minimal 800px.

      - label: "Keterangan Foto"
        name: "keterangan"
        widget: "string"
        required: false
        hint: "Caption singkat di bawah foto (opsional)"


  # ────────────────────────────────────────────────────────────────
  #  5. PENGATURAN UMUM
  #     Info kontak & jam buka — agar bisa diubah tanpa sentuh kode.
  # ────────────────────────────────────────────────────────────────
  - name: "pengaturan"
    label: "⚙️  Pengaturan Umum"
    description: >
      Informasi dasar desa wisata: nomor WhatsApp, jam buka, dan
      tautan media sosial. Ubah di sini jika ada perubahan kontak.
    files:
      - label: "Info Kontak & Jam Buka"
        name: "kontak"
        file: "_data/pengaturan/kontak.json"
        fields:
          - label: "Nomor WhatsApp"
            name: "whatsapp"
            widget: "string"
            hint: >
              Format internasional tanpa tanda + atau spasi.
              Contoh: 6285371234567
              (62 = kode negara Indonesia, lanjut nomor tanpa 0 di depan)

          - label: "Jam Buka"
            name: "jam_buka"
            widget: "string"
            default: "07.00 – 17.00 WIB"
            hint: "Contoh: 07.00 – 17.00 WIB"

          - label: "Hari Operasional"
            name: "hari_operasional"
            widget: "string"
            default: "Senin – Minggu"
            hint: "Contoh: Senin – Minggu, atau Selasa – Minggu (tutup Senin)"

          - label: "Alamat Lengkap"
            name: "alamat"
            widget: "text"
            hint: "Alamat yang tampil di section Reservasi dan footer"

          - label: "Link Instagram"
            name: "instagram"
            widget: "string"
            required: false
            hint: "URL lengkap, contoh: https://instagram.com/desa_wisata_nglumut"

          - label: "Link TikTok"
            name: "tiktok"
            widget: "string"
            required: false
            hint: "URL lengkap, contoh: https://tiktok.com/@desa_wisata_nglumut"