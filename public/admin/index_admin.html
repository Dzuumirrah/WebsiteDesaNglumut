<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Desa Wisata Nglumut</title>
  <meta name="cms-config-url" content="/admin/config.yml" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js" defer></script>
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #f6f7f2;
    }

    #cms-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      color: #f7e57b;
      background: #1b3a2d;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    #cms-loading .brand {
      color: #fff7b0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    #cms-loading .sub {
      max-width: 520px;
      color: rgba(255, 247, 176, 0.76);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    #cms-loading .help {
      display: none;
      max-width: 620px;
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.84rem;
      line-height: 1.55;
    }

    #cms-loading.is-slow .help {
      display: block;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(247, 229, 123, 0.28);
      border-top-color: #f7e57b;
      border-radius: 999px;
      animation: spin 0.8s linear infinite;
    }

    .cms-loading-hide {
      display: none !important;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="cms-loading" aria-live="polite">
    <div class="brand">Desa Wisata Nglumut</div>
    <div class="sub">Memuat panel admin...</div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="help">
      Jika halaman ini berhenti terlalu lama, buka <strong>/admin/</strong> lalu pastikan Netlify
      Identity dan Git Gateway sudah aktif di dashboard Netlify.
    </div>
  </div>

  <script>
    (function () {
      var loadingEl = document.getElementById('cms-loading');
      var cmsSelectors = [
        '[data-testid="cms-app"]',
        '.nc-root',
        '.css-1gj57a0-AppMainContainer',
        '[class*="AppMainContainer"]'
      ];

      function hasCmsMounted() {
        return document.body.children.length > 1 || cmsSelectors.some(function (selector) {
          return document.querySelector(selector);
        });
      }

      function hideLoading() {
        if (loadingEl) {
          loadingEl.classList.add('cms-loading-hide');
        }
      }

      var observer = new MutationObserver(function () {
        if (hasCmsMounted()) {
          hideLoading();
          observer.disconnect();
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });

      window.addEventListener('load', function () {
        if (hasCmsMounted()) {
          hideLoading();
        }
      });

      setTimeout(function () {
        if (hasCmsMounted()) {
          hideLoading();
        } else if (loadingEl) {
          loadingEl.classList.add('is-slow');
        }
      }, 7000);
    })();
  </script>
</body>
</html>
