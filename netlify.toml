# netlify.toml — Desa Wisata Nglumut (SECURE VERSION)
# ──────────────────────────────────────────────────────────────
# Fixes applied:
# - Only publish public folder (not entire root)
# - CSP and security headers
# - Proper redirects for admin panel
# - Cache control for static assets

[build]
  # Build command - regenerate index.html from template
  command = "node build.js"
  
  # FIXED: Only publish public folder, not entire root
  # This prevents exposing: _data/, build.js, index.template.html
  publish = "public"
  
  # Node version
  environment = { NODE_VERSION = "18" }

# ── Decap CMS Admin Panel Routing ──────────────────────────
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/config.yml"
  to = "/admin/config.yml"
  status = 200
  force = false

# ── Security Headers for Admin Panel ────────────────────────
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Main Security Headers ─────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Clickjacking protection
    X-Frame-Options = "SAMEORIGIN"
    
    # Prevent XSS attacks (older browsers)
    X-XSS-Protection = "1; mode=block"
    
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Disable browser features
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
    # Content Security Policy - STRICT
    # Allows: same-origin + Netlify Identity + Google Fonts + Google Maps
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.github.com https://api.netlify.com; frame-src 'self' https://www.google.com/maps/embed; object-src 'none'; base-uri 'self'; form-action 'self'"

# ── Cache Control for HTML (always fresh) ──────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Cache Control for Static Assets (long-lived) ────────────
[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# ── Prevent accessing sensitive files ─────────────────────
# (These shouldn't be in public/ folder, but just in case)
[[redirects]]
  from = "/_data/*"
  to = "/.nsfh"
  status = 404
  force = true

[[redirects]]
  from = "/build.js"
  to = "/.nsfh"
  status = 404
  force = true

[[redirects]]
  from = "/index.template.html"
  to = "/.nsfh"
  status = 404
  force = true

# ── 404 for unmapped requests ──────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
