[build]
  command = "node build.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Ensure /admin loads the SPA shell
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

# Security headers for admin panel
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
